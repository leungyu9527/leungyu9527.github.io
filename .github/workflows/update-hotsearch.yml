name: Update Hot Search Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch hot search data
        run: |
          curl -s -L "https://newshub.shenzjd.com/api/v1/batch?sources=weibo,zhihu,bilibili,douyin,toutiao,ithome,thepaper,tieba,github&limit=30" -o hot-data.json
          echo "Fetched data size: $(wc -c < hot-data.json) bytes"
          if [ ! -s hot-data.json ]; then
            echo "Error: hot-data.json is empty, aborting"
            exit 1
          fi

      - name: Add timestamp
        run: |
          python3 -c "
          import json, datetime
          with open('hot-data.json','r') as f:
              data = json.load(f)
          data['updatedAt'] = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')
          with open('hot-data.json','w') as f:
              json.dump(data, f, ensure_ascii=False)
          print('Timestamp added')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hot-data.json
          git diff --staged --quiet || git commit -m "Auto-update hot search data [skip ci]"
          git push
